name: Reusable Workflow | Simulate Framework Upgrade

on:
  workflow_call:
    inputs:
      network:
        required: true
        type: string
      provider-url:
        required: true
        type: string

jobs:
  simulate:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/ethereum-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Simulate only (no key, broadcast or proposal)
        env:
          RPC_URL: ${{ inputs.provider-url }}
          NETWORK: ${{ inputs.network }}
        run: new-ops-scripts/framework.sh "$NETWORK" upgrade
      - uses: actions/upload-artifact@v4
        with:
          name: framework-simulation-${{ inputs.network }}
          path: |
            packages/ethereum-contracts/.tmp/framework-safe-payloads.jsonl
            packages/ethereum-contracts/broadcast/**/dry-run/*.json
