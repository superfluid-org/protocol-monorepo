name: Simulate Ethereum Contracts Operation

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Protocol release version
        required: true
        default: v1
      network:
        description: Canonical metadata network name
        required: true
      script_name:
        description: Maintained operation (simulation only; execute approved payloads locally)
        type: choice
        options:
          - gov-action
          - resolver-token
          - resolver-set-key
          - deploy-custom-super-token
        required: true
      script_args:
        description: Arguments as a JSON array of strings (without network)
        required: true
        default: '[]'

jobs:
  simulate:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: nix develop .#ci-default -c bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - run: yarn install --immutable
      - name: Simulate maintained operation (no wallet or proposal credentials)
        working-directory: packages/ethereum-contracts
        env:
          NETWORK: ${{ inputs.network }}
          SCRIPT: ${{ inputs.script_name }}
          ARGS_JSON: ${{ inputs.script_args }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SIMULATE: '1'
        run: |
          case "$SCRIPT" in gov-action|resolver-token|resolver-set-key|deploy-custom-super-token) ;; *) exit 1 ;; esac
          jq -e 'type == "array" and all(.[]; type == "string" and (contains("\u0000") | not))' <<< "$ARGS_JSON"
          mapfile -d '' -t args < <(jq -j '.[] | ., "\u0000"' <<< "$ARGS_JSON")
          export RPC_URL="https://${NETWORK}.rpc.x.superfluid.dev"
          bash "new-ops-scripts/${SCRIPT}.sh" "$NETWORK" "${args[@]}"
