name: Verify framework sources

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Resolver protocol release version'
        required: true
        default: 'v1'
      only_network:
        description: 'Only a specific canonical metadata network'
        required: false
      plan:
        description: 'Read-only discovery and verification plan (no explorer requests)'
        type: boolean
        default: true

jobs:
  verify-framework:
    name: Verify framework sources
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        network: [avalanche-fuji, eth-sepolia, optimism-sepolia, base-sepolia, arc-testnet, xdai-mainnet, polygon-mainnet, optimism-mainnet, arbitrum-one, avalanche-c, bsc-mainnet, eth-mainnet, celo-mainnet, base-mainnet, scroll-mainnet, arc-mainnet]
    defaults:
      run:
        shell: nix develop .#ci-default -c bash -xe {0}
    steps:
      - uses: actions/checkout@v4

      - name: Check only_network
        if: ${{ inputs.only_network != '' && inputs.only_network != matrix.network }}
        shell: bash
        run: echo "DO_SKIP=1" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v27
        if: env.DO_SKIP != 1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: env.DO_SKIP != 1
        run: yarn install --immutable

      - name: Build verification artifacts
        if: env.DO_SKIP != 1 && !inputs.plan
        run: yarn workspace @superfluid-finance/ethereum-contracts build:contracts:foundry

      - name: Discover and verify framework
        if: env.DO_SKIP != 1
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RPC_URL: https://${{ matrix.network }}.rpc.x.superfluid.dev
          NETWORK: ${{ matrix.network }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -o pipefail
          cd packages/ethereum-contracts
          args=()
          if [[ "$PLAN" == "true" ]]; then args+=(--plan); fi
          # Sourcify needs no explorer key or manual-workflow-only secret.
          bash new-ops-scripts/verify-framework.sh "$NETWORK" \
            --verifier sourcify "${args[@]}" | tee framework-verification.json

      - name: Upload aggregate report
        if: always() && env.DO_SKIP != 1
        uses: actions/upload-artifact@v4
        with:
          name: framework-verification-${{ matrix.network }}
          path: packages/ethereum-contracts/framework-verification.json
          if-no-files-found: warn
