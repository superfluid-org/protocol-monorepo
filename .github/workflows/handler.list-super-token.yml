name: Simulate Super Token Listing

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Protocol release version
        required: true
        default: v1
      network:
        description: Canonical metadata network name
        required: true
      token_address:
        description: SuperToken address
        required: true
      symbol_override:
        description: Optional resolver symbol override
        required: false
      allow_update:
        description: Deliberately replace an occupied resolver entry
        type: boolean
        default: false

jobs:
  simulate:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: nix develop .#ci-default -c bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v13
      - run: yarn install --immutable
      - name: Simulate resolver action (never broadcast or propose)
        working-directory: packages/ethereum-contracts
        env:
          NETWORK: ${{ inputs.network }}
          TOKEN: ${{ inputs.token_address }}
          SYMBOL: ${{ inputs.symbol_override }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          ALLOW_UPDATE: ${{ inputs.allow_update && '1' || '' }}
        run: |
          export RPC_URL="https://${NETWORK}.rpc.x.superfluid.dev"
          args=("$NETWORK" list "$TOKEN")
          [[ -z "$SYMBOL" ]] || args+=("$SYMBOL")
          bash new-ops-scripts/resolver-token.sh "${args[@]}"
