name: Plan Testnet Framework Upgrade

# Persistent upgrades use production tooling; faucet provisioning is explicitly separate.
# No deployment credentials are needed by this manual simulation workflow.
on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Testnet to simulate'
        required: true
        type: choice
        options: [eth-sepolia, optimism-sepolia, avalanche-fuji, base-sepolia, arc-testnet]
        default: eth-sepolia

jobs:
  simulate:
    uses: ./.github/workflows/call.deploy-dry-run.yml
    with:
      network: ${{ inputs.network }}
      provider-url: https://${{ inputs.network }}.rpc.x.superfluid.dev
