name: Plan Mainnet Framework Upgrade

# Manual workflow deliberately requires no possibly absent deployment secrets.
# Broadcast and Safe proposal remain explicit operator-machine operations.
on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Supported metadata network name'
        required: true
      provider-url:
        description: 'Read-only RPC URL (do not put credentials in public inputs)'
        required: true

jobs:
  simulate:
    uses: ./.github/workflows/call.deploy-dry-run.yml
    with:
      network: ${{ inputs.network }}
      provider-url: ${{ inputs.provider-url }}
